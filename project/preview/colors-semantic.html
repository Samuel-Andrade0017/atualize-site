<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-text);background:var(--white);padding:22px;}
  .row{display:flex;gap:14px;}
  .sw{flex:1;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r-md);border:1px solid var(--line);}
  .dot{width:30px;height:30px;border-radius:9px;flex:none;}
  .name{font-size:12.5px;font-weight:700;color:var(--fg-1);}
  .hex{font-size:11px;color:var(--fg-3);font-family:ui-monospace,monospace;margin-top:1px;}
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><span class="dot" style="background:var(--success)"></span><div><div class="name">Success</div><div class="hex">#02A49E</div></div></div>
    <div class="sw"><span class="dot" style="background:var(--warning)"></span><div><div class="name">Warning</div><div class="hex">#E0A23C</div></div></div>
    <div class="sw"><span class="dot" style="background:var(--danger)"></span><div><div class="name">Danger</div><div class="hex">#E0594B</div></div></div>
    <div class="sw"><span class="dot" style="background:var(--whatsapp)"></span><div><div class="name">WhatsApp</div><div class="hex">#25D366</div></div></div>
  </div>
</body>
</html>
