<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-text);background:var(--white);padding:22px;}
  .grad{height:30px;border-radius:var(--r-pill);background:var(--grad-brand);margin-bottom:16px;}
  .row{display:flex;gap:12px;}
  .sw{flex:1;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--line);}
  .chip{height:64px;}
  .meta{padding:7px 9px 9px;}
  .name{font-size:12px;font-weight:700;color:var(--fg-1);}
  .hex{font-size:10.5px;color:var(--fg-3);font-family:ui-monospace,monospace;margin-top:2px;}
</style>
</head>
<body>
  <div class="grad"></div>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--navy-900)"></div><div class="meta"><div class="name">Petrol 900</div><div class="hex">#002C46</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--navy-800)"></div><div class="meta"><div class="name">Petrol 800</div><div class="hex">#004368</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--navy-700)"></div><div class="meta"><div class="name">Petrol 700</div><div class="hex">#0A567E</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--lime-400)"></div><div class="meta"><div class="name">Lime 400</div><div class="hex">#8DC81F</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--lime-600)"></div><div class="meta"><div class="name">Lime 600</div><div class="hex">#5A9120</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--cyan-400)"></div><div class="meta"><div class="name">Cyan 400</div><div class="hex">#00DDAD</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--cyan-500)"></div><div class="meta"><div class="name">Cyan 500</div><div class="hex">#02A49E</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--cyan-600)"></div><div class="meta"><div class="name">Cyan 600</div><div class="hex">#047E93</div></div></div>
  </div>
</body>
</html>
