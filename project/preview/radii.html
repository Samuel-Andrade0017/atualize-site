<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-text);background:var(--white);padding:24px;}
  .row{display:flex;gap:16px;align-items:flex-end;}
  .item{text-align:center;}
  .box{width:78px;height:62px;background:var(--navy-800);border:1px solid var(--navy-700);}
  .n{font-size:11.5px;color:var(--fg-1);font-weight:700;margin-top:8px;}
  .v{font-size:10.5px;color:var(--fg-3);font-family:ui-monospace,monospace;}
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:8px"></div><div class="n">sm</div><div class="v">8px</div></div>
    <div class="item"><div class="box" style="border-radius:14px"></div><div class="n">md</div><div class="v">14px</div></div>
    <div class="item"><div class="box" style="border-radius:20px"></div><div class="n">lg</div><div class="v">20px</div></div>
    <div class="item"><div class="box" style="border-radius:28px"></div><div class="n">xl</div><div class="v">28px</div></div>
    <div class="item"><div class="box" style="border-radius:999px"></div><div class="n">pill</div><div class="v">999px</div></div>
  </div>
</body>
</html>
