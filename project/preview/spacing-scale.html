<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-text);background:var(--white);padding:24px;}
  .row{display:flex;align-items:flex-end;gap:14px;}
  .item{text-align:center;}
  .bar{background:var(--cyan-500);border-radius:4px;width:34px;margin:0 auto;}
  .n{font-size:11px;color:var(--fg-1);font-weight:700;margin-top:7px;}
  .v{font-size:10.5px;color:var(--fg-3);font-family:ui-monospace,monospace;}
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="height:4px"></div><div class="n">1</div><div class="v">4</div></div>
    <div class="item"><div class="bar" style="height:8px"></div><div class="n">2</div><div class="v">8</div></div>
    <div class="item"><div class="bar" style="height:12px"></div><div class="n">3</div><div class="v">12</div></div>
    <div class="item"><div class="bar" style="height:16px"></div><div class="n">4</div><div class="v">16</div></div>
    <div class="item"><div class="bar" style="height:24px"></div><div class="n">5</div><div class="v">24</div></div>
    <div class="item"><div class="bar" style="height:32px"></div><div class="n">6</div><div class="v">32</div></div>
    <div class="item"><div class="bar" style="height:48px"></div><div class="n">7</div><div class="v">48</div></div>
    <div class="item"><div class="bar" style="height:64px"></div><div class="n">8</div><div class="v">64</div></div>
    <div class="item"><div class="bar" style="height:84px"></div><div class="n">9</div><div class="v">96</div></div>
  </div>
</body>
</html>
