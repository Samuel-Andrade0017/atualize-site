<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-text);background:var(--white);padding:22px;}
  .row{display:flex;gap:14px;}
  .sw{flex:1;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--line);}
  .chip{height:60px;}
  .meta{padding:7px 10px 9px;}
  .name{font-size:12px;font-weight:700;color:var(--fg-1);}
  .hex{font-size:11px;color:var(--fg-3);font-family:ui-monospace,monospace;margin-top:2px;}
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--white)"></div><div class="meta"><div class="name">White</div><div class="hex">#FFFFFF</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--paper)"></div><div class="meta"><div class="name">Paper</div><div class="hex">#F4F7F8</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--paper-2)"></div><div class="meta"><div class="name">Paper 2</div><div class="hex">#E9EEF1</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--line)"></div><div class="meta"><div class="name">Line</div><div class="hex">#E0E7EA</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--fg-3)"></div><div class="meta"><div class="name">FG 3</div><div class="hex">#6A8190</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--fg-2)"></div><div class="meta"><div class="name">FG 2</div><div class="hex">#3A5567</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink)"></div><div class="meta"><div class="name">Ink / FG 1</div><div class="hex">#052B40</div></div></div>
  </div>
</body>
</html>
